<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Recovery Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/product.css" />
  {% block extra_head %}{% endblock %}
</head>
<body>
<div class="p-app">
  <header class="p-topnav">
    <a class="p-brand" href="/ui">Recovery Agent</a>
    <nav class="p-nav" aria-label="Primary">
      <a href="/ui" class="{% if nav_active == 'overview' %}is-active{% endif %}">Overview</a>
      <a href="/ui/recover" class="{% if nav_active == 'recover' %}is-active{% endif %}">Recover</a>
      <a href="/ui/cases" class="{% if nav_active == 'cases' %}is-active{% endif %}">Cases</a>
      <a href="/ui/intelligence" class="{% if nav_active == 'intelligence' %}is-active{% endif %}">Intelligence</a>
      <a href="/ui/evaluate" class="{% if nav_active == 'evaluate' %}is-active{% endif %}">Evaluate</a>
      <a href="/ui/live-test" class="{% if nav_active == 'live_test' %}is-active{% endif %}">Live Test</a>
      <a href="/ui/api" class="{% if nav_active == 'api' %}is-active{% endif %}">API</a>
    </nav>
    <div class="p-nav-right">
      <input type="search" class="p-search" placeholder="Search cases…" aria-label="Search" />
      <a href="/sign-out" class="p-user-menu">Sign out</a>
    </div>
  </header>

  <div class="p-body">
    {% if sidebar %}
    <aside class="p-sidebar" aria-label="Section navigation">
      {% block sidebar %}{% endblock %}
    </aside>
    {% endif %}

    <main class="p-main">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
(function () {
  document.querySelectorAll("[data-tabs]").forEach(function (root) {
    var tabs = root.querySelectorAll(".p-tab");
    var panels = root.querySelectorAll(".p-tab-panel");
    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () {
        var id = tab.getAttribute("data-tab");
        tabs.forEach(function (t) { t.classList.toggle("is-active", t === tab); });
        panels.forEach(function (p) {
          p.classList.toggle("is-active", p.getAttribute("data-panel") === id);
        });
      });
    });
  });
})();
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
