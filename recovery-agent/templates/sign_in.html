{% extends "base_landing.html" %}
{% block title %}Sign in — Recovery Agent{% endblock %}
{% block content %}
<div class="l-signin-wrap">
  <div class="l-signin-card">
    <h1>Welcome back</h1>
    <p class="l-sub">Sign in to your Recovery Agent workspace.</p>
    <form method="post" action="/sign-in">
      <label for="email">Work email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" />
      <button type="submit" class="p-btn p-btn--primary">Continue to dashboard</button>
    </form>
    <p class="l-signin-note">Demo mode — no password required. Your session is stored locally.</p>
  </div>
</div>
{% endblock %}
